version: '3.8'

services:
  Frontend:
    build: ./Frontend
    container_name: emp-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always

  api:
    build: ./Backend
    container_name: emp-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root2
      DB_PASSWORD: mysecret123
      DB_NAME: employee_management
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: emp-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysecret123
      MYSQL_DATABASE: employee_management
      MYSQL_USER: root2
      MYSQL_PASSWORD: mysecret123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql

volumes:
  db_data:
